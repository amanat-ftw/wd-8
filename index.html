<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-10 px-4">

    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">

        <h2 class="text-2xl font-bold mb-1 text-center text-indigo-700">
            Student Registration
        </h2>

        <p class="text-center text-gray-500 mb-5 text-sm font-medium">
            Amanat Kalbande | USN-IT25004
        </p>

        <form id="registrationForm" novalidate>

            <!-- Name -->
            <label class="block font-semibold mb-1 text-sm text-gray-700">Student Name <span class="text-red-500">*</span></label>
            <input type="text" id="name"
                class="w-full border border-gray-300 p-2 mb-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                placeholder="Enter student name">

            <!-- Email -->
            <label class="block font-semibold mb-1 text-sm text-gray-700">Email <span class="text-red-500">*</span></label>
            <input type="email" id="email"
                class="w-full border border-gray-300 p-2 mb-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                placeholder="Enter email address">

            <!-- Password -->
            <label class="block font-semibold mb-1 text-sm text-gray-700">Password <span class="text-red-500">*</span></label>
            <div class="relative mb-3">
                <input type="password" id="password"
                    class="w-full border border-gray-300 p-2 pr-16 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                    placeholder="Enter password">
                <button type="button" id="togglePassword"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-indigo-600 font-semibold hover:text-indigo-800 px-2 py-1">
                    Show
                </button>
            </div>

            <!-- Mobile -->
            <label class="block font-semibold mb-1 text-sm text-gray-700">Mobile Number <span class="text-red-500">*</span></label>
            <input type="text" id="mobile" maxlength="10"
                class="w-full border border-gray-300 p-2 mb-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                placeholder="Enter 10-digit mobile number">

            <!-- State and PIN Code -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block font-semibold mb-1 text-sm text-gray-700">State <span class="text-red-500">*</span></label>
                    <input type="text" id="state"
                        class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                        placeholder="State">
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-sm text-gray-700">PIN Code <span class="text-red-500">*</span></label>
                    <input type="text" id="pincode" maxlength="6"
                        class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none"
                        placeholder="6-digit PIN">
                </div>
            </div>

            <!-- Country -->
            <label class="block font-semibold mb-1 text-sm text-gray-700">Country <span class="text-red-500">*</span></label>
            <select id="country"
                class="w-full border border-gray-300 p-2 mb-4 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none bg-white">
                <option value="">Select Country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
            </select>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-2.5 rounded-lg transition duration-200 shadow">
                Register
            </button>

            <!-- Output Message -->
            <p id="message" class="mt-4 text-center font-semibold text-sm"></p>

        </form>
    </div>

    <script>
        // Password toggle
        const toggleBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        toggleBtn.onclick = function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                this.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                this.textContent = "Show";
            }
        };

        // Form Submit Handler
        document.getElementById("registrationForm").onsubmit = function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = passwordInput.value;
            let mobile = document.getElementById("mobile").value.trim();
            let state = document.getElementById("state").value.trim();
            let pincode = document.getElementById("pincode").value.trim();
            let country = document.getElementById("country").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name === "" || email === "" || password === "" || mobile === "" || state === "" || pincode === "" || country === "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center font-semibold text-red-500";
                return;
            }

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center font-semibold text-red-500";
                return;
            }

            // Password validation
            if (password.length < 6) {
                message.innerHTML = "Password must be at least 6 characters.";
                message.className = "mt-4 text-center font-semibold text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length !== 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center font-semibold text-red-500";
                return;
            }

            // PIN code validation
            if (pincode.length !== 6 || isNaN(pincode)) {
                message.innerHTML = "Enter a valid 6-digit PIN code.";
                message.className = "mt-4 text-center font-semibold text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center font-semibold text-green-600";

            // Reset form
            this.reset();
            passwordInput.type = "password";
            toggleBtn.textContent = "Show";
        };
    </script>

</body>
</html>
